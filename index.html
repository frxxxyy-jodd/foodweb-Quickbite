
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBite - Food Delivery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #fffaf5;
    color: #333;
}

header {
    background: #ff5722;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}

header h1 {
    font-size: 28px;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-weight: bold;
}

.hero {
    text-align: center;
    padding: 65px 20px;
    background: #ffe0cc;
}

.hero h2 {
    font-size: 36px;
    color: #e64a19;
    margin-bottom: 15px;
}

.hero p {
    font-size: 18px;
    margin-bottom: 20px;
}

.hero button {
    background: #ff5722;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

h2.section-title {
    text-align: center;
    margin: 35px 0 25px;
    color: #e64a19;
}

.food-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    padding: 20px 7%;
}

.food-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px #ddd;
    text-align: center;
    padding-bottom: 18px;
    transition: 0.3s;
}

.food-card:hover {
    transform: translateY(-5px);
}

.food-card img {
    width: 100%;
    height: 165px;
    object-fit: cover;
}

.food-card h3 {
    margin: 12px 0;
}

.food-card p {
    color: #ff5722;
    font-weight: bold;
    margin-bottom: 12px;
}

.food-card button {
    background: #ff5722;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 5px;
    cursor: pointer;
}

.food-card button:hover, .hero button:hover {
    background: #d84315;
}

.cart {
    background: white;
    margin: 30px 7%;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 12px #ddd;
}

.cart h2 {
    color: #e64a19;
    margin-bottom: 15px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    gap: 10px;
}

.remove {
    background: #e53935;
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
}

#total {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
}

.order-btn {
    background: #2e9d50;
    color: white;
    border: none;
    padding: 12px 25px;
    margin-top: 15px;
    border-radius: 5px;
    cursor: pointer;
}

footer {
    background: #333;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 40px;
}

@media(max-width:600px) {
    header {
        flex-direction: column;
        gap: 15px;
    }
    nav a {
        margin: 0 7px;
    }
    .hero h2 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🍔 QuickBite</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#cart">Cart 🛒</a>
    </nav>
</header>

<section class="hero" id="home">
    <h2>Delicious Food, Delivered Fast!</h2>
    <p>Order your favourite food from QuickBite.</p>
    <button onclick="document.getElementById('menu').scrollIntoView()">
        Order Now
    </button>
</section>

<h2 class="section-title" id="menu">Our Delicious Menu</h2>

<div class="food-container" id="foodContainer"></div>

<section class="cart" id="cart">
    <h2>🛒 Your Shopping Cart</h2>
    <div id="cartItems">Your cart is empty.</div>
    <div id="total">Total: ₹0</div>
    <button class="order-btn" onclick="placeOrder()">
        Place Order
    </button>
</section>

<footer>
    <p>© 2026 QuickBite Food Delivery | All Rights Reserved</p>
    <p>Fresh Food, Happy Mood!</p>
</footer>

<script>
const foods = [
    {
        name: "Margherita Pizza",
        price: 199,
        image: "https://images.unsplash.com/photo-1579751626657-72bc17010498?w=500"
    },
    {
        name: "Veg Burger",
        price: 99,
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500"
    },
    {
        name: "Chicken Biryani",
        price: 249,
        image: "https://images.unsplash.com/photo-1563379091339-03246963d96c?w=500"
    },
    {
        name: "French Fries",
        price: 89,
        image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500"
    },
    {
        name: "Pasta",
        price: 179,
        image: "https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=500"
    },
    {
        name: "Dosa",
        price: 79,
        image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=500"
    },
    {
        name: "Sandwich",
        price: 109,
        image: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=500"
    },
    {
        name: "Chocolate Cake",
        price: 129,
        image: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500"
    },
    {
        name: "Ice Cream",
        price: 69,
        image: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=500"
    },
    {
        name: "Momos",
        price: 119,
        image: "https://images.unsplash.com/photo-1563245372-f21724e3856d?w=500"
    }
];

let cart = [];

function displayFoods() {
    const container = document.getElementById("foodContainer");

    foods.forEach((food, index) => {
        container.innerHTML += `
            <div class="food-card">
                <img src="${food.image}" alt="${food.name}"
                     onerror="this.src='https://placehold.co/500x300?text=Food'">
                <h3>${food.name}</h3>
                <p>₹${food.price}</p>
                <button onclick="addToCart(${index})">
                    Add to Cart
                </button>
            </div>
        `;
    });
}

function addToCart(index) {
    cart.push(foods[index]);
    updateCart();
}

function updateCart() {
    const cartItems = document.getElementById("cartItems");
    const totalElement = document.getElementById("total");

    cartItems.innerHTML = "";
    let total = 0;

    if (cart.length === 0) {
        cartItems.innerHTML = "Your cart is empty.";
    }

    cart.forEach((item, index) => {
        total += item.price;

        cartItems.innerHTML += `
            <div class="cart-item">
                <span>${item.name} - ₹${item.price}</span>
                <button class="remove" onclick="removeItem(${index})">
                    Remove
                </button>
            </div>
        `;
    });

    totalElement.innerHTML = "Total: ₹" + total;
}

function removeItem(index) {
    cart.splice(index, 1);
    updateCart();
}

function placeOrder() {
    if (cart.length === 0) {
        alert("Please add food items to your cart first!");
        return;
    }

    let total = cart.reduce((sum, item) => sum + item.price, 0);

    alert("Thank you for ordering from QuickBite!\nYour total is ₹" + total);

    cart = [];
    updateCart();
}

displayFoods();
</script>

</body>
</html>
